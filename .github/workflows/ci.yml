# CI da empresa de YouTube: roda as suites que nao dependem de midia pesada
# nem de credencial. As suites de episodio exigem os artefatos renderizados e
# por isso rodam na maquina de producao, nao aqui.
name: CI

on:
  push:
  workflow_dispatch:

jobs:
  suites:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar ffmpeg (sondagem de midia nos testes)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Bloqueios negativos
        run: node src/test-gates.js
      - name: Cliente YouTube contra espelho local
        run: node src/test-youtube.js
      - name: Seguranca do painel
        run: node src/test-security.js
      - name: Motor de evolucao
        run: node src/test-evolution.js
      - name: Prova integrada do ciclo
        run: node src/test-integration.js
      - name: Ajustes finais do ATO 4
        run: node src/test-ato4-fixes.js
      - name: A bateria nao destroi dado de producao
        run: node src/test-data-safety.js
