# CI da Etapa 0: a bateria roda em banco criado do zero pelas migrations,
# e o controle negativo (Lei 8) prova que a bateria fica vermelha quando a
# regra de imutabilidade é sabotada.
name: CI

on:
  push:
  pull_request:

jobs:
  bateria:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: corre-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: corre-api/package-lock.json
      - run: npm ci
      - name: Bateria (banco nasce das migrations, do zero)
        run: scripts/bateria.sh
      - name: Controle negativo (Lei 8 — sabotagem tem que deixar a bateria vermelha)
        run: scripts/controle-negativo.sh
